<main class="main"><header class="topbar"><div style="display:flex;align-items:center"><button class="mobile-menu" id="mobileMenu">☰</button><div class="crumb">BLOUNCER EDU / <b id="crumbPage">Dashboard</b></div></div><div class="top-right"><span class="today" id="dateToday"></span><button class="profile-chip" id="teacherChip" type="button"><span class="mini" id="teacherChipAvatar">👩‍🏫</span><b id="teacherChipName">Profil Guru</b></button></div></header><div id="view"></div></main></div><div id="modalRoot"></div>
<script>
(()=>{const KEY='guruverse_standalone_v1';const emojis=['👦','👧','🧒','👶','🧑','👩‍🎓','👨‍🎓','🧕','👳','🐣','🦊','🐼','🐯','🐸','🐰','🐻','🦁','🐨','🐵','🐧','🐥','🦄','🐱','🐶'];let state=load();let page='dashboard';let selectedAvatar=emojis[0];let soundEnabled=localStorage.getItem('blouncer_edu_sound')!=='off';let audioCtx=null;function softClick(){if(!soundEnabled)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(620,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(460,audioCtx.currentTime+.055);gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.026,audioCtx.currentTime+.009);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.10);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.105)}catch(err){}}function blank(){return{teacher:{avatar:'👩‍🏫',name:'',role:'Guru / Pengajar',institution:'',email:'',phone:'',bio:''},institutions:[],students:[],lessons:[],achievements:[],questions:[],grades:[],schedules:[],logs:[]}}function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}function today(){return new Date().toISOString().slice(0,10)}function dateFmt(d){if(!d)return '—';try{return new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}catch{return d}}function institutionName(id){return state.institutions.find(x=>x.id===id)?.name||'Lembaga belum dipilih'}function log(studentId,title,desc=''){state.logs.unshift({id:uid(),studentId,title,desc,date:today()});save()}function counts(){return{active:state.students.filter(s=>s.status==='aktif').length,alumni:state.students.filter(s=>s.status==='lulus').length,exit:state.students.filter(s=>s.status==='keluar').length}}function nav(p){page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumbPage').textContent=({dashboard:'Dashboard',lembaga:'Lembaga',aktif:'Santri Aktif',alumni:'Alumni',keluar:'Santri Keluar',pembelajaran:'Pembelajaran',pencapaian:'Pencapaian',banksoal:'Bank Soal',penilaian:'Penilaian',jadwal:'Jadwal',pengaturan:'Pengaturan','profil-guru':'Profil Guru'})[p]||p;document.getElementById('sidebar').classList.remove('open');render()}
function photoAvatar(photo,emoji='👦',cls='avatar'){return photo?`<div class="${cls}"><img class="photo-avatar" src="${photo}" alt="Foto profil"></div>`:`<div class="${cls}">${esc(emoji||'👦')}</div>`}
function attachmentField(label='Lampirkan file/PDF',existing=null){return `<div class="field full"><label>${label} (PDF, DOC, DOCX, JPG, PNG — maks 900 KB)</label><div class="file-box"><input type="file" data-attachment accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"><div class="file-meta">${existing?`File tersimpan: ${esc(existing.name)}. Unggah file baru untuk mengganti.`:'Lampiran akan ditampilkan di halaman materi setelah disimpan.'}</div></div></div>`}
function attachmentDisplay(att){if(!att||!att.data)return '';let safeName=esc(att.name||'Lampiran'),mime=att.type||'';let link=`<a href="${att.data}" download="${safeName}">📎 ${safeName}</a>`;if(mime==='application/pdf')return `<div class="file-item">${link}<details><summary>📄 Lihat pratinjau PDF di aplikasi</summary><iframe title="${safeName}" src="${att.data}" loading="lazy"></iframe></details></div>`;if(mime.startsWith('image/'))return `<div class="file-item">${link}<img src="${att.data}" alt="${safeName}"></div>`;return `<div class="file-item">${link}<div class="file-meta">Dokumen terlampir — tekan nama file untuk membuka atau mengunduh.</div></div>`}
function photoUploadField(current,label='Foto profil'){return `<div class="field full"><label>${label} (opsional)</label><input type="file" name="photoFile" accept="image/*" data-photo><div class="small-muted">Foto akan diperkecil otomatis agar penyimpanan lebih ringan.</div>${current?`<img class="photo-preview" data-photo-preview src="${current}" alt="Foto saat ini">`:`<img class="photo-preview" data-photo-preview style="display:none" alt="Preview foto">`}</div>`}
async function fileToData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function compressPhoto(file){let data=await fileToData(file);return new Promise(resolve=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),max=420,scale=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=()=>resolve(data);im.src=data})}
function render(){const v=document.getElementById('view');if(page==='dashboard')v.innerHTML=dashboard();else if(page==='lembaga')v.innerHTML=institutions();else if(['aktif','alumni','keluar'].includes(page))v.innerHTML=studentPage(page);else if(page==='pembelajaran')v.innerHTML=lessonsPage();else if(page==='pencapaian')v.innerHTML=achievementPage();else if(page==='banksoal')v.innerHTML=questionsPage();else if(page==='penilaian')v.innerHTML=gradesPage();else if(page==='jadwal')v.innerHTML=schedulesPage();else if(page==='pengaturan')v.innerHTML=settingsPage();else if(page==='profil-guru')v.innerHTML=teacherProfilePage();bindView();updateTeacherChip()}
function dashboard(){let c=counts();let recent=state.logs.slice(0,5).map(l=>`<div class="activity"><div class="activity-icon">📌</div><div><div class="activity-title">${esc(l.title)}</div><div class="activity-meta">${esc(l.desc)} · ${dateFmt(l.date)}</div></div></div>`).join('')||'<div class="small-muted">Aktivitas akan muncul setelah kamu mulai menggunakan aplikasi.</div>';return `<h1 class="page-title">Dashboard</h1><p class="sub">Ringkasan ruang kerja mengajarmu.</p><section class="welcome"><div><h2>Selamat datang di BLOUNCER EDU 👋</h2><p>Ruang kerja digital untuk mengelola kegiatan mengajar dan perkembangan santri.</p></div><div class="welcome-emoji">📚</div></section><div class="stats"><div class="stat"><div class="stat-icon">🏫</div><div><div class="stat-num">${state.institutions.length}</div><div class="stat-label">Lembaga Terdaftar</div></div></div><div class="stat"><div class="stat-icon">👨‍🎓</div><div><div class="stat-num">${c.active}</div><div class="stat-label">Santri Aktif</div></div></div><div class="stat"><div class="stat-icon">🎓</div><div><div class="stat-num">${c.alumni}</div><div class="stat-label">Alumni</div></div></div><div class="stat"><div class="stat-icon">📤</div><div><div class="stat-num">${c.exit}</div><div class="stat-label">Santri Keluar</div></div></div></div><div class="grid2"><section class="panel"><div class="panel-head"><h3>Lembaga Saya</h3><button class="btn small" data-action="add-inst">+ Tambah</button></div><div class="institution-list">${state.institutions.map(i=>`<div class="institution"><div class="inst-left"><div class="inst-icon">🏫</div><div><div class="inst-name">${esc(i.name)}</div><div class="inst-meta">${state.students.filter(s=>s.institutionId===i.id&&s.status==='aktif').length} santri aktif ${i.note?`· ${esc(i.note)}`:''}</div></div></div><button class="btn secondary small" data-action="edit-inst" data-id="${i.id}">Edit</button></div>`).join('')||'<div class="empty">Belum ada lembaga. Tambahkan lembagamu untuk mulai.</div>'}</div></section><section class="panel"><div class="panel-head"><h3>Aktivitas Terbaru</h3><span class="small-muted">5 terakhir</span></div>${recent}</section></div><div class="panel" style="margin-top:17px"><div class="panel-head"><h3>Santri Terbaru</h3><button class="btn small" data-action="add-student">+ Tambah Santri</button></div>${state.students.filter(s=>s.status==='aktif').slice(-5).reverse().map(s=>`<div class="activity"><div class="row-avatar">${s.avatar}</div><div><div class="activity-title">${esc(s.name)}</div><div class="activity-meta">${esc(institutionName(s.institutionId))} · ${esc(s.className||'Kelas belum diatur')}</div></div></div>`).join('')||'<div class="small-muted">Belum ada santri terdaftar.</div>'}</div>`}
function institutions(){return `<h1 class="page-title">Lembaga</h1><p class="sub">Kelola lembaga pendidikanmu, data santri akan dipisahkan berdasarkan lembaga.</p><div class="panel"><div class="panel-head"><h3>Daftar Lembaga</h3><button class="btn" data-action="add-inst">+ Tambah Lembaga</button></div><div class="institution-list">${state.institutions.map(i=>`<div class="institution"><div class="inst-left"><div class="inst-icon">🏫</div><div><div class="inst-name">${esc(i.name)}</div><div class="inst-meta">${state.students.filter(s=>s.institutionId===i.id&&s.status==='aktif').length} aktif · ${state.students.filter(s=>s.institutionId===i.id&&s.status==='lulus').length} alumni · ${state.students.filter(s=>s.institutionId===i.id&&s.status==='keluar').length} keluar</div></div></div><div class="quick-actions"><button class="btn secondary small" data-action="edit-inst" data-id="${i.id}">Edit</button><button class="btn danger small" data-action="delete-inst" data-id="${i.id}">Hapus</button></div></div>`).join('')||'<div class="empty">Belum ada lembaga yang ditambahkan.</div>'}</div></div>`}
function studentPage(status){let title={aktif:'Santri Aktif',alumni:'Arsip Alumni',keluar:'Santri Keluar'}[status],filtered=state.students.filter(s=>s.status===status);return `<h1 class="page-title">${title}</h1><p class="sub">${status==='aktif'?'Data santri yang sedang mengikuti pembelajaran.':status==='alumni'?'Data santri yang telah menyelesaikan pendidikan.':'Data santri yang berhenti atau pindah lembaga.'}</p><div class="toolbar"><input class="search" id="studentSearch" placeholder="Cari nama santri..."><select class="select" id="institutionFilter"><option value="">Semua lembaga</option>${state.institutions.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select>${status==='aktif'?'<button class="btn" data-action="add-student">+ Tambah Santri</button>':''}</div><div class="student-grid" id="studentGrid">${filtered.map(studentCard).join('')||'<div class="empty" style="grid-column:1/-1">Belum ada data di bagian ini.</div>'}</div>`}
function studentCard(s){let achieved=state.achievements.filter(a=>a.studentId===s.id).length;return `<div class="student-card" data-action="profile" data-id="${s.id}" data-name="${esc(s.name).toLowerCase()}" data-inst="${s.institutionId}">${photoAvatar(s.photoData,s.avatar||'👦')}<div class="student-name">${esc(s.name)}</div><div class="student-info">${esc(institutionName(s.institutionId))} · ${esc(s.className||'Tanpa kelas')}</div><span class="student-badge">🏆 ${achieved} Pencapaian</span></div>`}
function lessonsPage(){return `<h1 class="page-title">Rencana Pembelajaran</h1><p class="sub">Rencanakan materi, tandai pelaksanaan, dan catat evaluasi.</p><div class="toolbar"><button class="btn" data-action="add-lesson">+ Tambah Rencana</button><select class="select" id="lessonStatus"><option value="">Semua status</option><option value="rencana">Direncanakan</option><option value="berjalan">Sedang diajarkan</option><option value="selesai">Selesai</option><option value="ulang">Perlu diulang</option></select></div><div class="content-cards" id="lessonCards">${state.lessons.map(l=>lessonCard(l)).join('')||'<div class="empty" style="grid-column:1/-1">Belum ada rencana pembelajaran.</div>'}</div>`}
function lessonCard(l){let st={rencana:'Direncanakan',berjalan:'Sedang diajarkan',selesai:'Selesai',ulang:'Perlu diulang'};return `<div class="card generic-card" data-status="${l.status}"><h4>${esc(l.topic)}</h4><p>${esc(l.subject)} · ${esc(institutionName(l.institutionId))} · ${esc(l.className||'')}</p><p>${esc(l.goal||'Tujuan belum ditulis')}</p><span class="tag ${l.status==='selesai'?'':'gold'}">${st[l.status]||l.status}</span>${l.eval?`<p style="margin-top:12px">Evaluasi: ${esc(l.eval)}</p>`:''}${l.attachment?`<div class="file-list">${attachmentDisplay(l.attachment)}</div>`:''}<div class="quick-actions" style="margin-top:12px"><button class="btn secondary small" data-action="edit-lesson" data-id="${l.id}">Edit</button><select class="select" data-action="lesson-status" data-id="${l.id}" style="padding:7px;font-size:11px"><option value="rencana" ${l.status==='rencana'?'selected':''}>Rencana</option><option value="berjalan" ${l.status==='berjalan'?'selected':''}>Berjalan</option><option value="selesai" ${l.status==='selesai'?'selected':''}>Selesai</option><option value="ulang" ${l.status==='ulang'?'selected':''}>Perlu diulang</option></select><button class="btn danger small" data-action="delete-lesson" data-id="${l.id}">Hapus</button></div></div>`}
function achievementPage(){return `<h1 class="page-title">Pencapaian</h1><p class="sub">Catat apresiasi dan perkembangan santri, bukan hanya nilai akhir.</p><div class="toolbar"><button class="btn" data-action="add-achievement">+ Berikan Pencapaian</button></div><div class="panel">${state.achievements.slice().reverse().map(a=>{let s=state.students.find(x=>x.id===a.studentId);return `<div class="activity"><div class="activity-icon">🏆</div><div><div class="activity-title">${esc(a.title)} · ${s?esc(s.name):'Santri terarsip'}</div><div class="activity-meta">${dateFmt(a.date)} · ${s?esc(institutionName(s.institutionId)):''}</div><div class="timeline-desc">${esc(a.note||'')}</div>${a.attachment?`<div class="file-list">${attachmentDisplay(a.attachment)}</div>`:''}</div><button class="btn danger small" data-action="delete-achievement" data-id="${a.id}">Hapus</button></div>`}).join('')||'<div class="empty">Belum ada pencapaian tercatat.</div>'}</div>`}
function questionsPage(){return `<h1 class="page-title">Bank Soal</h1><p class="sub">Simpan soal berdasarkan mata pelajaran, materi, dan kelas.</p><div class="toolbar"><button class="btn" data-action="add-question">+ Tambah Soal</button><input class="search" id="questionSearch" placeholder="Cari soal atau materi..."></div><div class="panel" id="questionList">${state.questions.map(q=>`<div class="activity"><div class="activity-icon">📝</div><div style="flex:1"><div class="activity-title">${esc(q.question)}</div><div class="activity-meta">${esc(q.subject)} · ${esc(q.topic)} · ${esc(q.className||'')}</div>${q.options?`<div class="timeline-desc">${esc(q.options)}</div>`:''}<div class="timeline-desc"><b>Jawaban:</b> ${esc(q.answer||'—')}</div>${q.attachment?`<div class="file-list">${attachmentDisplay(q.attachment)}</div>`:''}</div><button class="btn danger small" data-action="delete-question" data-id="${q.id}">Hapus</button></div>`).join('')||'<div class="empty">Bank soal masih kosong.</div>'}</div>`}
function gradesPage(){return `<h1 class="page-title">Penilaian</h1><p class="sub">Rekam nilai tugas, ujian, praktik, dan hafalan.</p><div class="toolbar"><button class="btn" data-action="add-grade">+ Input Nilai</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Santri</th><th>Materi</th><th>Jenis</th><th>Nilai</th><th>Tanggal</th><th></th></tr></thead><tbody>${state.grades.map(g=>{let s=state.students.find(x=>x.id===g.studentId);return `<tr><td>${s?esc(s.name):'Santri terarsip'}</td><td>${esc(g.topic)}</td><td>${esc(g.type)}</td><td class="score">${esc(g.score)}</td><td>${dateFmt(g.date)}</td><td>${g.attachment?attachmentDisplay(g.attachment):''}<button class="btn danger small" data-action="delete-grade" data-id="${g.id}">×</button></td></tr>`}).join('')||'<tr><td colspan="6" style="text-align:center;color:#8994a3">Belum ada penilaian.</td></tr>'}</tbody></table></div>`}
function schedulesPage(){return `<h1 class="page-title">Jadwal</h1><p class="sub">Atur agenda pembelajaran dan jadwal mengajar.</p><div class="toolbar"><button class="btn" data-action="add-schedule">+ Tambah Jadwal</button></div><div class="content-cards">${state.schedules.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(s=>`<div class="card generic-card"><h4>${esc(s.title)}</h4><p>🗓️ ${dateFmt(s.date)} · ${esc(s.time||'')}</p><p>🏫 ${esc(institutionName(s.institutionId))} · ${esc(s.className||'')}</p>${s.note?`<p>${esc(s.note)}</p>`:''}${s.attachment?`<div class="file-list">${attachmentDisplay(s.attachment)}</div>`:''}<button class="btn danger small" data-action="delete-schedule" data-id="${s.id}">Hapus</button></div>`).join('')||'<div class="empty">Belum ada jadwal.</div>'}</div>`}
function updateTeacherChip(){let t=state.teacher||{},name=t.name||'Profil Guru',avatar=t.avatar||'👩‍🏫';let n=document.getElementById('teacherChipName'),a=document.getElementById('teacherChipAvatar');if(n)n.textContent=name;if(a){if(t.photoData)a.innerHTML=`<img src="${t.photoData}" alt="Foto guru" style="width:34px;height:34px;object-fit:cover;border-radius:50%">`;else a.textContent=avatar}}
function teacherProfilePage(){let t=state.teacher||{};return `<h1 class="page-title">Profil Guru</h1><p class="sub">Kelola identitas dan informasi profil pengajar.</p><section class="panel"><div class="profile-head">${photoAvatar(t.photoData,t.avatar||'👩‍🏫')}<div><h2 style="margin:0 0 5px">${esc(t.name||'Nama Guru belum diisi')}</h2><div class="small-muted">${esc(t.role||'Guru / Pengajar')}</div><div class="small-muted" style="margin-top:5px">${esc(t.institution||'Lembaga belum dicantumkan')}</div></div></div><div class="grid2"><div><p><b>Email:</b> ${esc(t.email||'Belum diisi')}</p><p><b>Nomor HP:</b> ${esc(t.phone||'Belum diisi')}</p><p><b>Bio:</b> ${esc(t.bio||'Tambahkan deskripsi singkat tentang dirimu sebagai guru.')}</p></div><div><p><b>Produk:</b> BLOUNCER EDU</p><p><b>Peran:</b> Pengelola pembelajaran</p><p class="small-muted">Profil ini tersimpan di browser perangkat ini.</p></div></div><button class="btn" data-action="edit-teacher-profile">✏️ Edit Profil Guru</button></section>`}
function editTeacherProfile(){let t=state.teacher||{},choices=['👩‍🏫','🧑‍🏫','👨‍🏫','🧕','👩','👨','🧑'];let body=`<div class="form-grid"><div class="field full"><label>Avatar</label>${photoUploadField(t.photoData,'Foto guru')}<div class="avatar-picker">${choices.map(a=>`<button type="button" class="avatar-choice ${a===(t.avatar||'👩‍🏫')?'selected':''}" data-teacher-avatar="${a}">${a}</button>`).join('')}</div><input type="hidden" name="avatar" value="${esc(t.avatar||'👩‍🏫')}"></div><div class="field"><label>Nama lengkap *</label><input name="name" required value="${esc(t.name||'')}"></div><div class="field"><label>Jabatan / peran</label><input name="role" value="${esc(t.role||'Guru / Pengajar')}"></div><div class="field"><label>Lembaga utama</label><input name="institution" value="${esc(t.institution||'')}"></div><div class="field"><label>Email</label><input type="email" name="email" value="${esc(t.email||'')}"></div><div class="field"><label>Nomor HP</label><input name="phone" value="${esc(t.phone||'')}"></div><div class="field full"><label>Bio / Deskripsi</label><textarea name="bio">${esc(t.bio||'')}</textarea></div></div>`;openModal('Edit Profil Guru',body,'Simpan Profil',fd=>{state.teacher={avatar:fd.get('avatar'),photoData:fd.get('photoData')||t.photoData||'',name:fd.get('name').trim(),role:fd.get('role').trim(),institution:fd.get('institution').trim(),email:fd.get('email').trim(),phone:fd.get('phone').trim(),bio:fd.get('bio').trim()};save();render();toast('Profil guru disimpan')});document.querySelectorAll('[data-teacher-avatar]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-teacher-avatar]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('[name=avatar]').value=b.dataset.teacherAvatar})}
function settingsPage(){return `<h1 class="page-title">Pengaturan & Data</h1><p class="sub">Kelola backup data aplikasi. Simpan salinan berkala.</p><div class="panel"><h3 style="margin-top:0">Preferensi BLOUNCER EDU</h3><label style="display:flex;align-items:center;gap:10px;margin:12px 0 18px;font-size:12px"><input type="checkbox" id="soundToggle" ${soundEnabled?'checked':''}> Aktifkan suara klik halus</label><h3 style="margin-top:0">Backup dan Restore</h3><p class="small-muted">Data BLOUNCER EDU tersimpan di browser perangkat ini. Backup untuk memindahkan atau menjaga data.</p><div class="quick-actions"><button class="btn" data-action="export">⬇️ Backup Data (JSON)</button><button class="btn secondary" data-action="import">⬆️ Restore Backup</button><button class="btn danger" data-action="clear-data">Hapus Semua Data</button></div><input type="file" id="importFile" accept="application/json" class="hidden"></div><div class="panel" style="margin-top:16px"><h3>Ringkasan Penyimpanan</h3><p class="small-muted">Lembaga: ${state.institutions.length} · Santri: ${state.students.length} · Rencana: ${state.lessons.length} · Bank soal: ${state.questions.length} · Penilaian: ${state.grades.length}</p><p class="small-muted">Versi standalone preview. Belum tersambung database cloud atau login.</p></div>`}
function openModal(title,body,submitLabel='Simpan',onSubmit=()=>{}){let root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" data-action="close-modal">×</button></div><form id="modalForm">${body}<div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Batal</button><button class="btn" type="submit">${submitLabel}</button></div></form></div></div>`;root.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.onclick=closeModal);root.querySelectorAll('[data-action]').forEach(b=>{if(b.dataset.action!=='close-modal')b.onclick=()=>action(b.dataset.action,b.dataset.id)});root.querySelector('#modalForm').onsubmit=async e=>{e.preventDefault();let form=e.target,fd=new FormData(form);try{const photo=form.querySelector('[data-photo]')?.files?.[0];if(photo){if(photo.size>8*1024*1024){toast('Foto maksimal 8 MB');return}fd.set('photoData',await compressPhoto(photo))}const file=form.querySelector('[data-attachment]')?.files?.[0];if(file){if(file.size>900*1024){toast('Lampiran maksimal 900 KB per file agar penyimpanan browser tidak penuh');return}const data=await fileToData(file);fd.set('attachment',JSON.stringify({name:file.name,type:file.type||'application/octet-stream',data}))}}catch(err){toast('Gagal membaca file. Coba file lain.');return}onSubmit(fd);closeModal()};root.querySelectorAll('.avatar-choice').forEach(b=>b.onclick=()=>{root.querySelectorAll('.avatar-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedAvatar=b.dataset.avatar});let photoInput=root.querySelector('[data-photo]');if(photoInput)photoInput.onchange=async()=>{let f=photoInput.files[0],img=root.querySelector('[data-photo-preview]');if(!f||!img)return;if(!f.type.startsWith('image/')){toast('Pilih file gambar');photoInput.value='';return}try{img.src=await compressPhoto(f);img.style.display='block'}catch{toast('Preview foto gagal')}}}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function instOptions(selected=''){return `<option value="">Pilih lembaga</option>${state.institutions.map(i=>`<option value="${i.id}" ${selected===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}`}
function addInst(){openModal('Tambah Lembaga',`<div class="form-grid"><div class="field full"><label>Nama lembaga *</label><input name="name" required placeholder="Nama lembaga"></div><div class="field full"><label>Keterangan</label><input name="note" placeholder="Alamat, jenjang, atau catatan"></div></div>`, 'Tambah',fd=>{let x={id:uid(),name:fd.get('name').trim(),note:fd.get('note').trim()};if(!x.name)return;state.institutions.push(x);save();render();toast('Lembaga ditambahkan')})}function editInst(id){let i=state.institutions.find(x=>x.id===id);if(!i)return;openModal('Edit Lembaga',`<div class="form-grid"><div class="field full"><label>Nama lembaga</label><input name="name" required value="${esc(i.name)}"></div><div class="field full"><label>Keterangan</label><input name="note" value="${esc(i.note||'')}"></div></div>`, 'Simpan',fd=>{i.name=fd.get('name').trim();i.note=fd.get('note').trim();save();render();toast('Lembaga diperbarui')})}
function studentForm(s=null){if(!state.institutions.length){toast('Tambahkan lembaga terlebih dahulu');nav('lembaga');return}selectedAvatar=s?.avatar||emojis[0];let avatarGrid=emojis.map(e=>`<button type="button" class="avatar-choice ${e===selectedAvatar?'selected':''}" data-avatar="${e}">${e}</button>`).join('');let body=`<div class="form-grid"><div class="field full"><label>Nama santri *</label><input name="name" required value="${esc(s?.name||'')}" placeholder="Nama lengkap"></div><div class="field"><label>Lembaga *</label><select name="institutionId" required>${instOptions(s?.institutionId||'')}</select></div><div class="field"><label>Kelas</label><input name="className" value="${esc(s?.className||'')}" placeholder="Contoh: 3 / A"></div><div class="field"><label>Tanggal masuk</label><input type="date" name="entryDate" value="${s?.entryDate||today()}"></div><div class="field"><label>Gender (opsional)</label><select name="gender"><option value="">Tidak dipilih</option><option ${s?.gender==='Laki-laki'?'selected':''}>Laki-laki</option><option ${s?.gender==='Perempuan'?'selected':''}>Perempuan</option></select></div><div class="field full"><label>Pilih avatar</label><div class="avatar-picker">${avatarGrid}</div>${photoUploadField(s?.photoData,'Foto santri (opsional)')}</div><div class="field full"><label>Catatan guru</label><textarea name="note" placeholder="Catatan tambahan">${esc(s?.note||'')}</textarea></div></div>`;openModal(s?'Edit Santri':'Tambah Santri',body,s?'Simpan Perubahan':'Tambah Santri',fd=>{let name=fd.get('name').trim();if(!name)return;let data={name,institutionId:fd.get('institutionId'),className:fd.get('className').trim(),entryDate:fd.get('entryDate'),gender:fd.get('gender'),avatar:selectedAvatar,photoData:fd.get('photoData')||s?.photoData||'',note:fd.get('note').trim()};if(s){Object.assign(s,data);log(s.id,'Profil santri diperbarui','Data biodata diperbarui')}else{let ns={id:uid(),...data,status:'aktif',exitDate:'',exitReason:'',gradDate:''};state.students.push(ns);log(ns.id,'Santri baru ditambahkan',name)}save();render();toast(s?'Profil diperbarui':'Santri ditambahkan')})}
function profile(id){let s=state.students.find(x=>x.id===id);if(!s)return;let his=state.logs.filter(l=>l.studentId===id).map(l=>`<div class="timeline-item"><div class="timeline-title">${esc(l.title)}</div><div class="timeline-meta">${dateFmt(l.date)}</div><div class="timeline-desc">${esc(l.desc)}</div></div>`).join('');let achievements=state.achievements.filter(a=>a.studentId===id).map(a=>`<div class="timeline-item"><div class="timeline-title">🏆 ${esc(a.title)}</div><div class="timeline-meta">${dateFmt(a.date)}</div><div class="timeline-desc">${esc(a.note||'')}</div></div>`).join('');let grades=state.grades.filter(g=>g.studentId===id).map(g=>`<div class="timeline-item"><div class="timeline-title">📊 ${esc(g.topic)} — ${esc(g.score)}</div><div class="timeline-meta">${esc(g.type)} · ${dateFmt(g.date)}</div></div>`).join('');let body=`<div class="profile-head">${photoAvatar(s.photoData,s.avatar||'👦')}<div><h2 style="margin:0 0 5px">${esc(s.name)}</h2><div class="small-muted">${esc(institutionName(s.institutionId))} · ${esc(s.className||'Kelas belum ditentukan')}</div><div style="margin-top:7px"><span class="tag ${s.status==='aktif'?'':'gray'}">${s.status==='aktif'?'Aktif':s.status==='lulus'?'Alumni':'Keluar'}</span></div></div></div><div class="quick-actions" style="margin-bottom:15px"><button class="btn secondary small" data-action="edit-student" data-id="${id}">Edit Profil</button>${s.status==='aktif'?`<button class="btn gold small" data-action="graduate" data-id="${id}">🎓 Lulus</button><button class="btn secondary small" data-action="exit-student" data-id="${id}">📤 Tandai Keluar</button>`:`<button class="btn small" data-action="restore-student" data-id="${id}">Aktifkan Kembali</button>`}<button class="btn danger small" data-action="delete-student" data-id="${id}">Hapus Permanen</button></div><div class="panel-head"><h3>Riwayat Belajar</h3></div><div class="timeline">${his||'<div class="timeline-desc">Belum ada aktivitas tercatat.</div>'}${grades}${achievements}</div><div style="margin-top:14px"><div class="small-muted">Tanggal masuk: ${dateFmt(s.entryDate)}${s.gradDate?` · Lulus: ${dateFmt(s.gradDate)}`:''}${s.exitDate?` · Keluar: ${dateFmt(s.exitDate)}`:''}</div>${s.note?`<p class="small-muted">Catatan guru: ${esc(s.note)}</p>`:''}</div>`;openModal('Profil Santri',body,'Tutup',()=>{})}
function confirmStatus(id,status){let s=state.students.find(x=>x.id===id);if(!s)return;let isGrad=status==='lulus';openModal(isGrad?'Konfirmasi Kelulusan':'Tandai Santri Keluar',`<p>Santri <b>${esc(s.name)}</b> akan dipindahkan ke ${isGrad?'arsip alumni':'arsip santri keluar'}. Riwayat belajarnya tetap tersimpan.</p><div class="form-grid"><div class="field"><label>Tanggal ${isGrad?'lulus':'keluar'}</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>Alasan (khusus keluar)</label><select name="reason"><option value="">Pilih alasan</option><option>Pindah lembaga</option><option>Berhenti belajar</option><option>Lainnya</option></select></div><div class="field full"><label>Catatan</label><textarea name="note"></textarea></div></div>`,isGrad?'Konfirmasi Lulus':'Konfirmasi Keluar',fd=>{s.status=status;if(isGrad)s.gradDate=fd.get('date');else{s.exitDate=fd.get('date');s.exitReason=fd.get('reason')}log(id,isGrad?'Santri dinyatakan lulus':'Santri keluar',fd.get('note')||fd.get('reason')||'Status diperbarui');save();render();toast('Status santri diperbarui')})}
function addLesson(l=null){if(!state.institutions.length){toast('Tambahkan lembaga terlebih dahulu');nav('lembaga');return}let body=`<div class="form-grid"><div class="field"><label>Lembaga *</label><select name="institutionId" required>${instOptions(l?.institutionId||'')}</select></div><div class="field"><label>Kelas</label><input name="className" value="${esc(l?.className||'')}"></div><div class="field"><label>Mata pelajaran *</label><input name="subject" required value="${esc(l?.subject||'')}" placeholder="Fiqih, Akhlak..."></div><div class="field"><label>Topik/materi *</label><input name="topic" required value="${esc(l?.topic||'')}"></div><div class="field full"><label>Tujuan pembelajaran</label><textarea name="goal">${esc(l?.goal||'')}</textarea></div><div class="field full"><label>Evaluasi/catatan</label><textarea name="eval">${esc(l?.eval||'')}</textarea></div>${attachmentField('Lampiran materi (PDF/file)',l?.attachment)}<div class="field"><label>Status</label><select name="status"><option value="rencana" ${l?.status==='rencana'?'selected':''}>Direncanakan</option><option value="berjalan" ${l?.status==='berjalan'?'selected':''}>Sedang diajarkan</option><option value="selesai" ${l?.status==='selesai'?'selected':''}>Selesai</option><option value="ulang" ${l?.status==='ulang'?'selected':''}>Perlu diulang</option></select></div></div>`;openModal(l?'Edit Rencana':'Tambah Rencana',body,'Simpan',fd=>{let data={institutionId:fd.get('institutionId'),className:fd.get('className').trim(),subject:fd.get('subject').trim(),topic:fd.get('topic').trim(),goal:fd.get('goal').trim(),eval:fd.get('eval').trim(),status:fd.get('status'),attachment:fd.get('attachment')?JSON.parse(fd.get('attachment')):(l?.attachment||null)};if(l)Object.assign(l,data);else state.lessons.push({id:uid(),...data});save();render();toast('Rencana pembelajaran tersimpan')})}
function addAchievement(){let active=state.students.filter(s=>s.status==='aktif');if(!active.length){toast('Belum ada santri aktif');return}openModal('Berikan Pencapaian',`<div class="form-grid"><div class="field full"><label>Santri *</label><select name="studentId" required>${active.map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(institutionName(s.institutionId))}</option>`).join('')}</select></div><div class="field"><label>Nama pencapaian *</label><input name="title" required placeholder="Contoh: Hafalan Hebat"></div><div class="field"><label>Tanggal</label><input type="date" name="date" value="${today()}"></div>${attachmentField('Lampiran pencapaian (sertifikat/foto)')}<div class="field full"><label>Catatan</label><textarea name="note"></textarea></div></div>`, 'Berikan',fd=>{let studentId=fd.get('studentId'),title=fd.get('title').trim();state.achievements.push({id:uid(),studentId,title,date:fd.get('date'),note:fd.get('note').trim(),attachment:fd.get('attachment')?JSON.parse(fd.get('attachment')):null});log(studentId,'Pencapaian: '+title,fd.get('note'));save();render();toast('Pencapaian ditambahkan')})}
function addQuestion(){openModal('Tambah Soal',`<div class="form-grid"><div class="field"><label>Mata pelajaran *</label><input name="subject" required></div><div class="field"><label>Materi *</label><input name="topic" required></div><div class="field"><label>Kelas</label><input name="className"></div><div class="field"><label>Jenis soal</label><select name="type"><option>Pilihan Ganda</option><option>Isian</option><option>Uraian</option><option>Benar/Salah</option></select></div><div class="field full"><label>Soal *</label><textarea name="question" required></textarea></div><div class="field full"><label>Opsi jawaban (jika ada)</label><textarea name="options" placeholder="A. ...\nB. ...\nC. ...\nD. ..."></textarea></div><div class="field full"><label>Jawaban/kunci</label><input name="answer"></div>${attachmentField('Lampiran soal / dokumen sumber')}</div>`, 'Simpan Soal',fd=>{state.questions.push({id:uid(),subject:fd.get('subject'),topic:fd.get('topic'),className:fd.get('className'),type:fd.get('type'),question:fd.get('question'),options:fd.get('options'),answer:fd.get('answer'),attachment:fd.get('attachment')?JSON.parse(fd.get('attachment')):null});save();render();toast('Soal disimpan')})}
function addGrade(){let active=state.students.filter(s=>s.status==='aktif');if(!active.length){toast('Belum ada santri aktif');return}openModal('Input Penilaian',`<div class="form-grid"><div class="field full"><label>Santri *</label><select name="studentId" required>${active.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(institutionName(s.institutionId))}</option>`).join('')}</select></div><div class="field"><label>Materi *</label><input name="topic" required></div><div class="field"><label>Jenis penilaian</label><select name="type"><option>Ujian</option><option>Tugas</option><option>Praktik</option><option>Hafalan</option><option>Observasi</option></select></div><div class="field"><label>Nilai/status *</label><input name="score" required placeholder="Nilai atau catatan singkat"></div>${attachmentField('Lampiran penilaian (lembar kerja/PDF)')}<div class="field"><label>Tanggal</label><input type="date" name="date" value="${today()}"></div></div>`, 'Simpan Nilai',fd=>{let studentId=fd.get('studentId');state.grades.push({id:uid(),studentId,topic:fd.get('topic'),type:fd.get('type'),score:fd.get('score'),date:fd.get('date'),attachment:fd.get('attachment')?JSON.parse(fd.get('attachment')):null});log(studentId,'Penilaian: '+fd.get('topic'),fd.get('type')+' · '+fd.get('score'));save();render();toast('Nilai tersimpan')})}
function addSchedule(){if(!state.institutions.length){toast('Tambahkan lembaga terlebih dahulu');nav('lembaga');return}openModal('Tambah Jadwal',`<div class="form-grid"><div class="field full"><label>Nama agenda *</label><input name="title" required></div><div class="field"><label>Lembaga *</label><select name="institutionId" required>${instOptions()}</select></div><div class="field"><label>Kelas</label><input name="className"></div><div class="field"><label>Tanggal *</label><input type="date" name="date" required value="${today()}"></div><div class="field"><label>Waktu</label><input name="time" placeholder="08.00 - 09.00"></div>${attachmentField('Lampiran jadwal (PDF/file)')}<div class="field full"><label>Catatan</label><textarea name="note"></textarea></div></div>`, 'Simpan Jadwal',fd=>{state.schedules.push({id:uid(),title:fd.get('title'),institutionId:fd.get('institutionId'),className:fd.get('className'),date:fd.get('date'),time:fd.get('time'),note:fd.get('note'),attachment:fd.get('attachment')?JSON.parse(fd.get('attachment')):null});save();render();toast('Jadwal ditambahkan')})}
function bindView(){let soundToggle=document.getElementById('soundToggle');if(soundToggle)soundToggle.onchange=()=>{soundEnabled=soundToggle.checked;localStorage.setItem('blouncer_edu_sound',soundEnabled?'on':'off');toast(soundEnabled?'Suara klik aktif':'Suara klik dimatikan')};document.querySelectorAll('[data-action]').forEach(el=>{let a=el.dataset.action;if(['lesson-status'].includes(a))return;el.addEventListener('click',()=>action(a,el.dataset.id))});let ss=document.getElementById('studentSearch'),sf=document.getElementById('institutionFilter');if(ss){function filter(){let q=ss.value.toLowerCase(),inst=sf.value;document.querySelectorAll('.student-card').forEach(c=>c.classList.toggle('hidden',!c.dataset.name.includes(q)||(inst&&c.dataset.inst!==inst)))}ss.addEventListener('input',filter);sf.addEventListener('change',filter)}let ls=document.getElementById('lessonStatus');if(ls)ls.onchange=()=>document.querySelectorAll('#lessonCards [data-status]').forEach(c=>c.classList.toggle('hidden',!!ls.value&&c.dataset.status!==ls.value));let qs=document.getElementById('questionSearch');if(qs)qs.oninput=()=>document.querySelectorAll('#questionList .activity').forEach(c=>c.classList.toggle('hidden',!c.textContent.toLowerCase().includes(qs.value.toLowerCase())));document.querySelectorAll('[data-action="lesson-status"]').forEach(sel=>sel.onchange=()=>{let l=state.lessons.find(x=>x.id===sel.dataset.id);if(l){l.status=sel.value;save();render();toast('Status materi diperbarui')}})}
function action(a,id){switch(a){case'add-inst':addInst();break;case'edit-inst':editInst(id);break;case'delete-inst':if(state.students.some(s=>s.institutionId===id)){toast('Lembaga masih memiliki data santri. Pindahkan santri terlebih dahulu.');return}if(confirm('Hapus lembaga ini?')){state.institutions=state.institutions.filter(i=>i.id!==id);save();render()}break;case'add-student':studentForm();break;case'profile':profile(id);break;case'edit-teacher-profile':editTeacherProfile();break;case'edit-student':closeModal();studentForm(state.students.find(s=>s.id===id));break;case'graduate':closeModal();confirmStatus(id,'lulus');break;case'exit-student':closeModal();confirmStatus(id,'keluar');break;case'restore-student':let s=state.students.find(x=>x.id===id);if(s){s.status='aktif';s.exitDate='';s.gradDate='';log(id,'Santri diaktifkan kembali','Status kembali aktif');save();closeModal();render();toast('Santri kembali aktif')}break;case'delete-student':let st=state.students.find(x=>x.id===id);if(st&&confirm(`Hapus permanen data ${st.name}? Ini juga menghapus riwayat, penilaian, dan pencapaian terkait.`)){state.students=state.students.filter(x=>x.id!==id);state.logs=state.logs.filter(x=>x.studentId!==id);state.achievements=state.achievements.filter(x=>x.studentId!==id);state.grades=state.grades.filter(x=>x.studentId!==id);save();closeModal();render();toast('Data dihapus permanen')}break;case'add-lesson':addLesson();break;case'edit-lesson':addLesson(state.lessons.find(x=>x.id===id));break;case'delete-lesson':if(confirm('Hapus rencana ini?')){state.lessons=state.lessons.filter(x=>x.id!==id);save();render()}break;case'add-achievement':addAchievement();break;case'delete-achievement':if(confirm('Hapus pencapaian?')){state.achievements=state.achievements.filter(x=>x.id!==id);save();render()}break;case'add-question':addQuestion();break;case'delete-question':if(confirm('Hapus soal?')){state.questions=state.questions.filter(x=>x.id!==id);save();render()}break;case'add-grade':addGrade();break;case'delete-grade':if(confirm('Hapus penilaian?')){state.grades=state.grades.filter(x=>x.id!==id);save();render()}break;case'add-schedule':addSchedule();break;case'delete-schedule':if(confirm('Hapus jadwal?')){state.schedules=state.schedules.filter(x=>x.id!==id);save();render()}break;case'export':exportData();break;case'import':document.getElementById('importFile').click();break;case'clear-data':if(confirm('Hapus semua data BLOUNCER EDU di browser ini? Tindakan tidak dapat dibatalkan.')){localStorage.removeItem(KEY);state=blank();render();toast('Data lokal dikosongkan')}break;}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='guruverse-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Backup data diunduh')}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{softClick();nav(b.dataset.page)});let teacherChip=document.getElementById('teacherChip');if(teacherChip)teacherChip.onclick=()=>{softClick();nav('profil-guru')};document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el&&!el.dataset.action.startsWith('close-modal'))softClick()},{capture:true});document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');let dateEl=document.getElementById('dateToday');dateEl.textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.classList.contains('modal-back'))closeModal()});document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){let file=e.target.files[0],reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result);if(!confirm('Timpa data yang ada dengan backup ini?'))return;state=Object.assign(blank(),parsed);save();render();toast('Backup berhasil dipulihkan')}catch{toast('File backup tidak valid')}};reader.readAsText(file)}});render();
})();
</script><script>
