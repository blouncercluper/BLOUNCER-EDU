name: Deploy BLOUNCER EDU to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site and raster PWA icons
        run: |
          mkdir -p dist/icons
          cp index.html manifest.webmanifest sw.js README.md dist/
          cp icons/icon.svg dist/icons/
          python -m pip install --user cairosvg
          python - <<'PY'
          import cairosvg
          source = 'icons/icon.svg'
          for size in (192, 512):
              cairosvg.svg2png(url=source, write_to=f'dist/icons/icon-{size}.png', output_width=size, output_height=size)
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
